[package]
name = "caprine"
version = "3.0.1"
description = "Minimal Messenger wrapper for Windows and Linux"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/visnia/caprine"
homepage = "https://github.com/visnia/caprine"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "=2.5.2"
tauri-plugin-opener = "=2.7.0"
tauri-plugin-store = "=2.5.0"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-window-state = "=2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
base64 = "0.22"
png = "0.18"
percent-encoding = "2"
tokio = { version = "1", features = ["sync", "macros", "time"] }
tauri-plugin-updater = "=2.13.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_UI_Shell", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "=0.62.2", features = ["Win32_System_Com", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "UI_Notifications"] }
webview2-com = "=0.39.1"
tauri-winrt-notification = { path = "vendor/tauri-winrt-notification" }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }
notify-rust = { version = "=4.18.1", default-features = false, features = ["z-with-tokio"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
