[package]
name = "caprine"
version = "3.0.0-alpha.1"
description = "Minimal Messenger wrapper for Windows and Linux"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/visnia/caprine"
homepage = "https://github.com/visnia/caprine"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "=2.5.2"
tauri-plugin-opener = "=2.7.0"
tauri-plugin-store = "=2.5.0"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-window-state = "=2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_UI_Shell"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
