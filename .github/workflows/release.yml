name: Release

# Push a tag matching package.json's version (for example v4.0.0). The result
# is a draft release; publishing it makes latest.yml / latest-linux.yml
# visible to the in-app updater.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            platform: win
          # Older glibc baseline for the AppImage.
          - os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches version
        shell: bash
        run: node -e "const v=require('./package.json').version; if ('v'+v !== process.env.GITHUB_REF_NAME) { console.error('tag', process.env.GITHUB_REF_NAME, 'version', v); process.exit(1) }"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build and upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx electron-builder --${{ matrix.platform }} --publish always
