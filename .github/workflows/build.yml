name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Package
        run: npx electron-builder --${{ matrix.platform }} --publish never
      # Hosted runners have a desktop, so this shows the real Windows title
      # bar in each theme without a Windows machine at hand.
      - name: Screenshot the app in each theme
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $data = Join-Path $env:APPDATA 'com.visnia.caprine'
          New-Item -ItemType Directory -Force $data, screenshots | Out-Null
          foreach ($theme in 'light', 'dark', 'oled') {
            Set-Content (Join-Path $data 'settings.json') "{`"theme`": `"$theme`"}"
            Start-Process release/win-unpacked/caprine.exe
            Start-Sleep -Seconds 20
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = [System.Drawing.Bitmap]::new($bounds.Width, $bounds.Height)
            [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bitmap.Save("screenshots/$theme.png")
            Get-Process caprine -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 3
          }
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: windows-screenshots-${{ github.sha }}
          path: screenshots/
      - uses: actions/upload-artifact@v7
        with:
          name: caprine-${{ matrix.platform }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.AppImage
